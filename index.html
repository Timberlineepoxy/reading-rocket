<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reading Rocket</title>
<meta name="theme-color" content="#6C4BF4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading Rocket">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6E8; --card:#FFFFFF; --ink:#2B2340; --muted:#7A7091; --line:#F0E6D6;
  --purple:#6C4BF4; --purple-d:#4F31D2; --orange:#FF7A1A; --orange-d:#E0600A;
  --yellow:#FFC93C; --green:#22C55E; --green-d:#15A349; --pink:#FF5C8A; --teal:#12B5A6;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  padding-bottom:calc(96px + var(--safe-b));overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
h1,h2,h3,.fun,button{font-family:'Fredoka','Nunito',system-ui,sans-serif}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.2px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{background:var(--hdr,linear-gradient(135deg,#6C4BF4 0%,#8B5CF6 60%,#A855F7 100%));color:#fff;
  padding:calc(14px + var(--safe-t)) 0 22px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
header::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(2px 2px at 12% 30%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 30% 70%,#fff 50%,transparent 51%),
  radial-gradient(3px 3px at 52% 22%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 70% 60%,#fff 50%,transparent 51%),
  radial-gradient(2px 2px at 88% 28%,#fff 50%,transparent 51%),radial-gradient(3px 3px at 80% 85%,#fff 50%,transparent 51%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.hi{font-family:'Fredoka';font-size:26px;font-weight:600;line-height:1.1}
.hi small{display:block;font-family:'Nunito';font-size:14px;font-weight:700;opacity:.85;margin-top:2px}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font-family:'Fredoka';font-size:18px;font-weight:600;white-space:nowrap}
.gear{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;
  font-size:21px;font-weight:600;color:#fff;background:var(--purple);border-radius:18px;padding:15px 22px;
  box-shadow:0 5px 0 var(--purple-d);transition:transform .06s,box-shadow .06s;min-height:58px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--purple-d)}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)} .btn.green:active{box-shadow:0 1px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)} .btn.orange:active{box-shadow:0 1px 0 var(--orange-d)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 5px 0 #E3D8C6} .btn.white:active{box-shadow:0 1px 0 #E3D8C6}
.btn.small{font-size:17px;min-height:46px;padding:10px 16px;border-radius:14px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;color:var(--muted);font-family:'Nunito';font-weight:800;font-size:15px;padding:10px;cursor:pointer;text-decoration:underline}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(60,40,120,.06)}
.mission{display:flex;gap:16px;align-items:center;margin-top:-14px;position:relative}
.ringbox{position:relative;flex:none}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mission h3{font-size:20px} .mission p{margin:4px 0 12px;color:var(--muted);font-size:15px}
.reward{margin-top:14px;display:flex;align-items:center;gap:12px}
.bar{height:14px;border-radius:999px;background:#EFE7FF;overflow:hidden;flex:1}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--orange))}

.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px}
.sectionhead h2{font-size:24px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{white-space:nowrap;border:0;background:#fff;color:var(--muted);font-size:16px;font-weight:600;border-radius:999px;padding:9px 16px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.fchip.on{background:var(--ink);color:#fff;box-shadow:none}

/* ---------- covers & shelf ---------- */
.cover{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:hsl(var(--h,260) 70% 58%);
  box-shadow:inset -6px 0 0 rgba(0,0,0,.12),0 6px 14px rgba(40,20,90,.18)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cover .gen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;
  color:#fff;font-family:'Fredoka';font-weight:600;font-size:16px;line-height:1.15;word-break:break-word}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 14px}
@media (min-width:480px){.shelf{grid-template-columns:repeat(4,1fr)}}
.tile{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.tile:active .cover{transform:scale(.96)}
.tile .cover{transition:transform .08s}
.tile .t{font-family:'Fredoka';font-weight:600;font-size:14px;margin-top:8px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .pbar{height:7px;border-radius:9px;background:#EDE5F7;margin-top:6px;overflow:hidden}
.tile .pbar i{display:block;height:100%;background:var(--teal);border-radius:9px}
.tile .pp{font-size:12px;color:var(--muted);margin-top:3px}
.ribbon{position:absolute;z-index:2;top:8px;right:-30px;transform:rotate(35deg);background:var(--yellow);color:var(--ink);
  font-family:'Fredoka';font-size:11px;font-weight:700;padding:3px 34px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.empty{text-align:center;padding:30px 10px}
.empty .big{font-size:64px}
.empty p{color:var(--muted);font-size:17px}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(92px + var(--safe-b));z-index:20;border-radius:999px;padding:14px 22px}

/* ---------- book page ---------- */
.backbtn{background:none;border:0;font-family:'Fredoka';font-size:18px;font-weight:600;color:var(--purple);padding:16px 0 8px;cursor:pointer}
.bookhero{display:flex;gap:18px;align-items:flex-end}
.bookhero .cover{width:132px;flex:none}
.bookhero h1{font-size:26px;line-height:1.15}
.bookhero .by{color:var(--muted);margin-top:4px}
.track{position:relative;height:56px;margin:18px 4px 6px}
.track .line{position:absolute;left:24px;right:24px;top:27px;border-top:4px dashed #D9CCF5}
.track .done{position:absolute;left:24px;top:25px;height:8px;border-radius:9px;background:linear-gradient(90deg,var(--yellow),var(--orange))}
.track .e{position:absolute;top:8px;font-size:34px;line-height:1}
.track .rocket{position:absolute;top:6px;font-size:34px;transform:translateX(-50%) rotate(45deg);transition:left .6s}
.bigpage{font-family:'Fredoka';font-size:30px;font-weight:600;text-align:center}
.bigpage span{color:var(--purple)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:#F7F2FF;border-radius:16px;padding:12px}
.fact b{display:block;font-family:'Fredoka';font-size:20px;font-weight:600}
.fact small{color:var(--muted)}
.note{background:#FFF4D6;border-radius:16px;padding:12px 14px;margin-top:10px;font-size:16px}
.stack{display:grid;gap:14px;margin-top:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- timer ---------- */
.picker{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x mandatory}
.picker .tile{width:86px;flex:none;scroll-snap-align:start;opacity:.55}
.picker .tile.sel{opacity:1}
.picker .tile.sel .cover{outline:4px solid var(--orange);outline-offset:3px}
.timerbox{display:flex;justify-content:center;margin:10px 0 6px}
.clock{font-family:'Fredoka';font-size:58px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.clocksub{color:var(--muted);font-size:15px;margin-top:6px}
.encourage{text-align:center;font-family:'Fredoka';font-size:19px;font-weight:600;color:var(--purple);min-height:26px;margin:8px 0 16px}
.nowreading{display:flex;align-items:center;gap:12px;justify-content:center}
.nowreading .cover{width:44px}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}

/* ---------- trophies ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:#fff;border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line)}
.stat .e{font-size:26px} .stat b{display:block;font-family:'Fredoka';font-size:28px;font-weight:600;line-height:1.1}
.stat small{color:var(--muted)}
.stat b i{font-style:normal;font-size:16px;margin:0 4px 0 1px;color:var(--muted)}
button.stat{border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;position:relative}
button.stat::after{content:"›";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:26px;color:#C9BCF7}
button.stat:active{transform:scale(.97)}
.stat.wide{grid-column:1/-1;display:flex;align-items:center;gap:14px}
.stat.wide .e{font-size:34px}

/* ---------- background layer + walking pets ---------- */
body{background:transparent}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:var(--bg)}
#fx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
/* dark backgrounds: words sitting right on the background turn white */
body.darkbg main .sectionhead h2,body.darkbg main .sectionhead span,body.darkbg .bgroup h3,body.darkbg .bgroup span,
body.darkbg .shelf .tile .t,body.darkbg .shelf .tile .pp,body.darkbg main>.hint,body.darkbg main>p.hint,body.darkbg main>h2,
body.darkbg .backbtn,body.darkbg .bookhero h1,body.darkbg .bookhero .by,body.darkbg .bookhero .fun,body.darkbg .stack .link,
body.darkbg .clock,body.darkbg .clocksub,body.darkbg .encourage,body.darkbg .picker .tile .t,body.darkbg .nowreading,body.darkbg main>div>.link,
body.darkbg main>.empty:not(.card) p{color:#fff !important;text-shadow:0 1px 3px rgba(0,0,0,.55)}
body.darkbg main>p.hint b,body.darkbg main>p.hint .link{color:#fff !important}
#pets{position:fixed;inset:0;z-index:40;pointer-events:none;overflow:hidden}
#watchTap{display:none;position:fixed;inset:0;z-index:46;align-items:flex-end;justify-content:center;padding-bottom:calc(28px + var(--safe-b))}
#watchTap span{background:rgba(43,35,64,.75);color:#fff;font-family:'Fredoka';font-size:16px;padding:10px 18px;border-radius:999px;transition:opacity 1s}
#watchTap.faded span{opacity:0}
body.watch #watchTap{display:flex}
body.watch header,body.watch main,body.watch nav{visibility:hidden}
body.watch{overflow:hidden}
.watchbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:14px}
.pet{position:absolute;left:0;top:0;will-change:transform}
.pet .petsvg{display:block;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.pet .rigsvg{display:block}
.pet .shadow{position:absolute;left:18%;right:18%;bottom:-3px;height:7px;border-radius:50%;background:rgba(0,0,0,.2);filter:blur(2px)}
.pet.flyer .shadow{display:none}
.petsvg .leg,.petsvg .shin,.petsvg .torso,.petsvg .head,.petsvg .tail,.petsvg .wing,.petsvg .ear,
.petsvg .kick,.petsvg .reach,.petsvg .hopbody,.petsvg .waddle,.petsvg .bwing{transform-box:view-box}
.walking .petsvg .leg{animation:stride var(--t) linear infinite}
.walking .petsvg .shin{animation:knee var(--t) linear infinite}
.walking .petsvg .torso{animation:bob calc(var(--t) / 2) ease-in-out infinite}
.walking .petsvg .head{animation:nod calc(var(--t) / 2) ease-in-out infinite}
.walking .petsvg .waddle{animation:waddle var(--t) ease-in-out infinite}
.walking .petsvg .hopbody{animation:hopjump var(--t) ease-in-out infinite}
.walking .petsvg .kick{animation:kick var(--t) ease-in-out infinite}
.walking .petsvg .reach{animation:reach var(--t) ease-in-out infinite}
.petsvg .tail{animation:wag 1.1s ease-in-out infinite alternate}
.petsvg .ear{animation:wag 2.4s ease-in-out infinite alternate}
.petsvg .wing{animation:flap .38s ease-in-out infinite alternate}
.petsvg .bwing{animation:bflap .3s ease-in-out infinite alternate}
@keyframes stride{0%{transform:rotate(var(--a))}50%{transform:rotate(calc(var(--a) * -1))}100%{transform:rotate(var(--a))}}
@keyframes knee{0%{transform:rotate(0)}22%{transform:rotate(var(--k))}45%,100%{transform:rotate(0)}}
@keyframes bob{50%{transform:translateY(-1.6px)}}
@keyframes nod{50%{transform:rotate(-3deg)}}
@keyframes waddle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes hopjump{0%,100%{transform:translateY(0)}45%{transform:translateY(-14px)}}
@keyframes kick{0%,100%{transform:rotate(0)}30%{transform:rotate(38deg)}60%{transform:rotate(-8deg)}}
@keyframes reach{0%,100%{transform:rotate(0)}40%{transform:rotate(-34deg)}}
@keyframes wag{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes flap{from{transform:rotate(-38deg)}to{transform:rotate(28deg)}}
@keyframes bflap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
.nextup{margin-top:14px}
.nextrow{display:flex;align-items:center;gap:12px;padding:6px 0}
.nextrow+.nextrow{border-top:2px solid var(--line);margin-top:4px;padding-top:10px}
.nicon{width:58px;flex:none;display:flex;justify-content:center;align-items:center;font-size:34px}
.nicon svg{max-width:58px;height:auto;max-height:40px}
.nlabel{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nswatch{position:relative;display:block;width:54px;height:40px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.nswatch i{position:absolute;left:0;right:0;top:0;height:9px}
.nswatch span{position:absolute;right:4px;bottom:3px;display:flex}
.nswatch span>*{max-height:24px;max-width:34px;width:auto;height:auto}
.ugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ucard{background:#fff;border:0;border-radius:20px;padding:12px 8px;text-align:center;box-shadow:0 2px 0 var(--line);font:inherit;color:inherit;cursor:pointer;position:relative}
.ucard .e{font-size:40px;line-height:1.15;display:block}
.ucard .pic{height:52px;display:flex;align-items:flex-end;justify-content:center}
.ucard .pic svg{max-height:52px;max-width:92%;height:auto}
.ucard.locked .pic{filter:grayscale(1);opacity:.35}
.ucard b{display:block;font-family:'Fredoka';font-weight:600;font-size:14px;margin-top:6px}
.ucard small{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.ucard.locked .e,.ucard.locked .sw{filter:grayscale(1);opacity:.35}
.ucard.on{outline:4px solid var(--orange);outline-offset:-4px}
.ucard .sw{height:52px;border-radius:12px;margin:0 4px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ucard .sw i{position:absolute;left:0;right:0;top:0;height:11px}
.ucard .sw .thumb{position:absolute;right:6px;bottom:4px;display:flex;align-items:flex-end}
.ucard .sw .thumb>*{max-height:30px;max-width:44px;width:auto;height:auto}
.ucard .sw .thumb img{height:28px}
.ucard .lock{position:absolute;top:8px;right:10px;font-size:14px}
.week{display:flex;align-items:flex-end;gap:8px;height:150px;position:relative;padding-top:10px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.week .b{width:100%;border-radius:10px 10px 4px 4px;background:#C9BCF7;min-height:4px}
.week .b.met{background:var(--green)}
.week .d{font-size:13px;color:var(--muted);margin-top:6px}
.week .d.today{color:var(--ink)}
.week .m{font-size:12px;color:var(--muted);margin-bottom:3px}
.goalline{position:absolute;left:0;right:0;border-top:3px dashed var(--orange);opacity:.7}
.goalline span{position:absolute;right:0;top:-20px;font-size:11px;color:var(--orange)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{background:#fff;border-radius:20px;padding:14px 8px;text-align:center;box-shadow:0 2px 0 var(--line)}
.badge .e{font-size:38px;line-height:1.1}
.badge b{display:block;font-family:'Fredoka';font-weight:600;font-size:14px;margin-top:6px;line-height:1.15}
.badge small{display:block;color:var(--muted);font-size:11px;margin-top:4px;line-height:1.2}
.badge.locked .e{filter:grayscale(1);opacity:.35}
button.badge{border:0;font:inherit;color:inherit;cursor:pointer;width:100%}
button.badge:active{transform:scale(.96)}
.badge .mini{display:block;height:5px;border-radius:9px;background:#EEE7F8;margin:7px 8px 0;overflow:hidden}
.badge .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));border-radius:9px}
.bdetail{text-align:center;padding:4px 4px 6px;clear:both}
.bd-e{font-size:92px;line-height:1.05;margin-top:6px;animation:pop .45s cubic-bezier(.2,1.6,.4,1),wobble 1.4s .5s ease-in-out infinite}
.bdetail.locked .bd-e{filter:grayscale(1);opacity:.4;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.bdetail h2{font-size:28px;margin:8px 0 2px}
.bd-group{display:inline-block;background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.bd-d{font-family:'Fredoka';font-size:19px;font-weight:600;margin:12px 0}
.bd-won{background:linear-gradient(135deg,#FFF4C9,#FFE08A);border-radius:18px;padding:12px 14px;font-size:16px}
.bd-won b{font-family:'Fredoka';font-size:19px;font-weight:600;display:block}
.bd-lock{background:#fff;border-radius:18px;padding:12px 14px;font-size:16px;color:var(--muted)}
.bd-prog{background:#fff;border-radius:18px;padding:12px 14px;margin-top:10px;text-align:left}
.bd-prog .bar{height:14px}
.bd-prog small{display:block;color:var(--muted);margin-top:6px;text-align:center}
.bd-tip{margin:12px 6px 0;color:var(--muted);font-size:15px}
.bd-nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.bd-nav button{background:#fff;border:0;border-radius:999px;padding:10px 16px;font-family:'Fredoka';font-size:16px;font-weight:600;color:var(--purple);cursor:pointer}
.bd-nav button[disabled]{opacity:.3}
.bd-nav span{color:var(--muted);font-size:14px}
.badge.locked b{color:var(--muted)}
.bgroup{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.bgroup h3{font-size:18px}
.bgroup span{color:var(--muted);font-size:14px}

/* ---------- parent ---------- */
label.l{display:block;font-family:'Fredoka';font-weight:600;font-size:17px;margin:16px 0 6px}
.in{width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;border:3px solid #E9DFF9;background:#fff;color:var(--ink);outline:none}
.in:focus{border-color:var(--purple)}
.stepper{display:flex;gap:8px;align-items:center}
.stepper .in{text-align:center;font-family:'Fredoka';font-size:26px;font-weight:600;padding:8px;min-width:0;flex:1}
.stepper .sb{flex:none;width:54px;height:54px;border-radius:14px;border:0;background:#EFE7FF;color:var(--purple);font-size:19px;font-weight:600;cursor:pointer}
.stepper .sb:active{background:#DCCEFF}
.hint{color:var(--muted);font-size:14px;margin-top:6px}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:2px solid var(--line);font-size:15px}
.log li span:last-child{color:var(--muted);text-align:right}

/* ---------- nav ---------- */

body.darkbg .bmhead h3,body.darkbg .bmhead span{color:#fff}
.envbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:18px;padding:10px 14px;background:linear-gradient(135deg,#FF7A1A,#FFB020);color:#fff;font-family:'Fredoka';font-size:20px;font-weight:600;cursor:pointer;box-shadow:0 5px 0 var(--orange-d);margin-bottom:10px}

@keyframes rvShake{0%,60%,100%{transform:rotate(0)}65%{transform:rotate(-6deg)}70%{transform:rotate(6deg)}75%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}85%{transform:rotate(0)}}

  background:repeating-conic-gradient(var(--rc) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 25%,transparent 68%);mask:radial-gradient(circle,#000 25%,transparent 68%);
  animation:rvSpin 9s linear infinite,rvShow .6s .5s ease-out forwards}
.rv-rays.common{--rc:rgba(230,160,95,.4)} .rv-rays.rare{--rc:rgba(205,225,245,.45)} .rv-rays.epic{--rc:rgba(175,115,255,.6)} .rv-rays.legendary{--rc:rgba(255,215,90,.7)}

.rv-rar.common{background:#C47A3A}.rv-rar.rare{background:#7F94AA}.rv-rar.epic{background:#8B4DFF}.rv-rar.legendary{background:linear-gradient(90deg,#FF9A1F,#FFD23F,#FF9A1F);color:#4A2800}

<body>

<div class="shade" id="shade"><div class="sheet" id="sheet"></div></div>
<div class="party" id="party"><div class="box" id="partybox"></div></div>
<div class="reveal" id="reveal"><div class="rv-in" id="rvIn"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="photoIn" accept="image/*" capture="environment" hidden>
<input type="file" id="importIn" accept="application/json,.json" hidden>

<script>
/* =========================================================
   Reading Rocket — everything is saved on this phone.
   ========================================================= */
const KEY = 'readingRocket.v1';
const DEFAULTS = {
  name: 'Reader', goal: 20, books: [], sessions: [], goalDays: {}, badges: {},
  stars: 0, pagesRead: 0, rereads: 0, rewardsGiven: 0, unlocked: {}, bg: 'cream', pets: [], reward: { text: '', cost: 0 }, timer: null, selBook: null, chimed: '', bonusDone: {}, marks: {}, sfx: { goal: 'popper', bonus: 'fireworks', book: 'applause' }
};
let S = load();
let view = 'shelf', currentBook = null, shelfFilter = 'all', parentOK = false, unlockTab = 'animal';
let addFlow = null, progressCtx = null;

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.books)) return Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), s);
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Uh oh, the phone is out of room to save!'); }
}

/* ---------- photo covers ----------
   The shelf is saved in the browser's small storage (about 5 MB per website, however empty the phone is).
   Photos of covers are big, so they live in the phone's much bigger database (IndexedDB) and a book keeps
   only a short "idb:<id>" tag. PHOTOS keeps them in memory so pages can draw them straight away. */
const PHOTOS = {};
const photoDB = new Promise(res => {
  try { const r = indexedDB.open('readingRocket', 1); r.onupgradeneeded = () => r.result.createObjectStore('covers'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); }
  catch (e) { res(null); }
});
async function photoTx(mode, fn) {
  const db = await photoDB; if (!db) throw new Error('no photo database');
  return new Promise((res, rej) => { const tx = db.transaction('covers', mode); fn(tx.objectStore('covers')); tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error); });
}
const coverSrc = c => c && c.startsWith('idb:') ? (PHOTOS[c.slice(4)] || '') : c;
// Keeps a photo in the database and returns its tag; if the database can't be used, the photo stays inline.
async function storePhoto(dataURL) {
  const id = uid();
  try { await photoTx('readwrite', st => st.put(dataURL, id)); PHOTOS[id] = dataURL; return 'idb:' + id; }
  catch (e) { return dataURL; }
}
function loadPhotos() {
  return photoTx('readonly', st => { const r = st.openCursor(); r.onsuccess = () => { const c = r.result; if (c) { PHOTOS[c.key] = c.value; c.continue(); } }; }).catch(() => {});
}
// Moves photos still saved inside the shelf (older versions, restored backups) into the database.
async function movePhotos() {
  let moved = false;
  for (const b of S.books) if (b.cover && b.cover.startsWith('data:')) { const tag = await storePhoto(b.cover); if (tag !== b.cover) { b.cover = tag; moved = true; } }
  if (moved) save();
  return moved;
}
// Deletes photos of books that are no longer on the shelf.
function prunePhotos() {
  const used = new Set(S.books.map(b => b.cover).filter(c => c && c.startsWith('idb:')).map(c => c.slice(4)));
  if (addFlow && addFlow.chosen.cover && addFlow.chosen.cover.startsWith('idb:')) used.add(addFlow.chosen.cover.slice(4));
  const gone = Object.keys(PHOTOS).filter(id => !used.has(id));
  if (gone.length) photoTx('readwrite', st => gone.forEach(id => st.delete(id))).then(() => gone.forEach(id => delete PHOTOS[id])).catch(() => {});
}

/* ---------- little helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); };
const book = id => S.books.find(b => b.id === id);
const hue = t => { let h = 0; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const sortTitle = (a, b) => a.title.localeCompare(b.title, undefined, { sensitivity: 'base', numeric: true });
const fmtMin = secs => { const m = Math.round(secs / 60); return m < 60 ? `${m} min` : `${Math.floor(m / 60)} hr ${m % 60} min`; };
const dayName = k => keyToDate(k).toLocaleDateString(undefined, { weekday: 'short' });
const niceDate = ms => {
  if (!ms) return 'Not yet';
  const k = dayKey(new Date(ms)), t = dayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, -1)) return 'Yesterday';
  return new Date(ms).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
};

function timerMs() { const t = S.timer; return t ? t.accum + (t.startedAt ? Date.now() - t.startedAt : 0) : 0; }
function secsOn(day) {
  let s = S.sessions.reduce((a, x) => a + (x.day === day ? x.secs : 0), 0);
  if (S.timer && S.timer.day === day) s += timerMs() / 1000;
  return s;
}
function streak() {
  let d = dayKey(), n = 0;
  if (!S.goalDays[d]) d = addDays(d, -1);
  while (S.goalDays[d]) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak() {
  const days = Object.keys(S.goalDays).sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  return best;
}
const totalSecs = () => S.sessions.reduce((a, x) => a + x.secs, 0);
const finishedCount = () => S.books.filter(b => b.status === 'finished').length;

/* ---------- covers ---------- */
function coverHTML(b, extra = '') {
  return `<div class="cover" style="--h:${hue(b.title)}">${coverSrc(b.cover) ? `<img src="${esc(coverSrc(b.cover))}" alt="" loading="lazy" onerror="this.remove()">` : ''}<span class="gen">${esc(b.title)}</span>${extra}</div>`;
}
function ring(pct, size, stroke, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, p = Math.max(0, Math.min(1, pct));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#EFE7FF" stroke-width="${stroke}"/>
    <circle class="ringfg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p)}" transform="rotate(-90 ${size / 2} ${size / 2})" style="transition:stroke-dashoffset .5s"/></svg>`;
}

/* ---------- badges ---------- */
const DAY = 864e5;
const weekOf = k => { const d = keyToDate(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d); }; // Monday
const pagesOf = s => Math.max(0, (s.to || 0) - (s.from || 0));
function tally(keyFn, valFn) { const m = {}; for (const s of S.sessions) { const k = keyFn(s); m[k] = (m[k] || 0) + valFn(s); } return m; }
const most = o => Math.max(0, ...Object.values(o));
const minsByDay = () => tally(s => s.day, s => s.secs / 60);
const finishedBooks = () => S.books.filter(b => b.status === 'finished');
const readOn = md => S.sessions.some(s => md.includes(s.day.slice(5)));
const starsEarned = () => S.sessions.reduce((a, s) => a + Math.floor(s.secs / 60), 0) + 10 * Object.keys(S.goalDays).length + 50 * finishedCount();
function perfectWeek() {
  return Object.keys(S.goalDays).some(d => weekOf(d) === d && [1, 2, 3, 4, 5, 6].every(i => S.goalDays[addDays(d, i)]));
}
function weekend() {
  const days = new Set(S.sessions.map(s => s.day));
  return [...days].some(d => keyToDate(d).getDay() === 6 && days.has(addDays(d, 1)));
}
function bounceBack() {
  const days = Object.keys(S.goalDays).sort();
  return days.some((d, i) => i > 0 && !S.goalDays[addDays(d, -1)]);
}
function doubleFinish() {
  const t = finishedBooks().map(b => b.finishedAt || 0).filter(Boolean).sort((a, b) => a - b);
  return t.some((x, i) => i > 0 && x - t[i - 1] <= 7 * DAY);
}
function superFan() {
  const n = {};
  for (const b of finishedBooks()) if (b.author) { const a = b.author.toLowerCase(); n[a] = (n[a] || 0) + 1; }
  return most(n) >= 3;
}

const BADGE_GROUPS = [['start', '🚀 Getting started'], ['pages', '📄 Pages'], ['books', '📚 Books'], ['time', '⏱️ Reading time'],
  ['habit', '🔥 Every day'], ['special', '🎉 Special']];
const BADGES = [
  { c: 'start', id: 'first',  e: '🚀', n: 'Blast Off',        d: 'Use the reading timer once',       t: () => S.sessions.length >= 1 },
  { c: 'start', id: 'goal1',  e: '🎯', n: 'Mission Complete', d: 'Reach your daily goal',            t: () => Object.keys(S.goalDays).length >= 1 },
  { c: 'start', id: 'shelf5', e: '🗂️', n: 'Collector',        d: 'Have 5 books on your shelf',       t: () => S.books.length >= 5 },

  { c: 'pages', id: 'p100',   e: '📄', n: 'Page Turner',      d: 'Read 100 pages',                   t: () => S.pagesRead >= 100 },
  { c: 'pages', id: 'p500',   e: '📚', n: 'Page Blaster',     d: 'Read 500 pages',                   t: () => S.pagesRead >= 500 },
  { c: 'pages', id: 'p1000',  e: '📖', n: 'Thousand Pager',   d: 'Read 1,000 pages',                 t: () => S.pagesRead >= 1000 },
  { c: 'pages', id: 'p2000',  e: '🏔️', n: 'Page Mountain',    d: 'Read 2,000 pages',                 t: () => S.pagesRead >= 2000 },
  { c: 'pages', id: 'p5000',  e: '🪐', n: 'Page Planet',      d: 'Read 5,000 pages',                 t: () => S.pagesRead >= 5000 },
  { c: 'pages', id: 'p10000', e: '🌠', n: 'Page Galaxy',      d: 'Read 10,000 pages',                t: () => S.pagesRead >= 10000 },
  { c: 'pages', id: 'pday50', e: '🌪️', n: 'Page Storm',       d: 'Read 50 pages in one day',         t: () => most(tally(s => s.day, pagesOf)) >= 50 },
  { c: 'pages', id: 'pwk150', e: '🏎️', n: 'Page Racer',       d: 'Read 150 pages in one week',       t: () => most(tally(s => weekOf(s.day), pagesOf)) >= 150 },

  { c: 'books', id: 'b1',     e: '🏁', n: 'Book Finisher',    d: 'Finish a whole book',              t: () => finishedCount() >= 1 },
  { c: 'books', id: 'b3',     e: '🎩', n: 'Hat Trick',        d: 'Finish 3 books',                   t: () => finishedCount() >= 3 },
  { c: 'books', id: 'b5',     e: '🐛', n: 'Bookworm',         d: 'Finish 5 books',                   t: () => finishedCount() >= 5 },
  { c: 'books', id: 'b10',    e: '🏆', n: 'Library Legend',   d: 'Finish 10 books',                  t: () => finishedCount() >= 10 },
  { c: 'books', id: 'b20',    e: '🦉', n: 'Wise Owl',         d: 'Finish 20 books',                  t: () => finishedCount() >= 20 },

const RAR_LABEL = { common: '🥉 Common', rare: '🥈 Rare!', epic: '💜 EPIC!', legendary: '🌟 LEGENDARY!' };
const RAR_SHORT = { common: '🥉 Common', rare: '🥈 Rare', epic: '💜 Epic', legendary: '🌟 Legendary' };

const snapOf = b => ({ title: b.title, pal: b.pal || null, icons: b.icons || null });
// 0 sketch, 1 colours (a quarter of the way), 2 pictures (half), 3 fancy (three quarters), 4 won and opened
function bookStage(b) {
  const m = markOf(b);
  if (m && m.open) return 4;
  if (m || b.status === 'finished') return 3;
  const p = b.totalPages ? b.page / b.totalPages : (b.secs || 0) / 5400;
  return p >= .75 ? 3 : p >= .5 ? 2 : p >= .25 ? 1 : 0;
}
function bookSpec(b, stage) {
  const seed = RRBM.hash(b.id), m = markOf(b);
  return { seed, title: b.title, pal: b.pal || RRBM.fallbackPal(seed), icons: b.icons || RRBM.iconsFor(seed, b.title).icons, rarity: m ? m.rar : null, stage: stage ?? bookStage(b) };
}
function markSpec(id, stage = 4) {
  if (id.startsWith('b:')) {
    const b = book(id.slice(2)), m = S.marks[id] || {};
    if (b) return bookSpec(b, stage);
    const s = m.snap || {}, seed = RRBM.hash(id.slice(2));
    return { seed, title: s.title || 'A great book', pal: s.pal || RRBM.fallbackPal(seed), icons: s.icons || RRBM.iconsFor(seed, s.title).icons, rarity: m.rar, stage };
  }
  const d = MARKDEFS.find(x => x.id === id);
  return { seed: RRBM.hash(id), title: d.n, pal: d.pal, icons: d.icons, shape: d.shape, pattern: d.pat, rarity: d.rar, stage };
}
// Longer books win fancier bookmarks; finishing one on a 7-day streak bumps it up one more.
const RANKS = ['common', 'rare', 'epic', 'legendary'];
function rarityFor(b) {
  const pg = b.totalPages || 0, h = (b.secs || 0) / 3600;
  let r = pg >= 250 || h >= 5 ? 3 : pg >= 150 || h >= 2.5 ? 2 : pg >= 80 || h >= 1 ? 1 : 0;
  if (streak() >= 7) r = Math.min(3, r + 1);
  return RANKS[r];
}
const unopened = () => Object.keys(S.marks || {}).filter(id => !S.marks[id].open && (id.startsWith('b:') || MARKDEFS.some(d => d.id === id)))
  .sort((a, b) => S.marks[a].t - S.marks[b].t);
function checkMarks() {
  S.marks ||= {};
  const fresh = [], have = starsEarned();
  const give = (id, rar, extra) => { if (S.marks[id]) return; S.marks[id] = { t: Date.now() + fresh.length, open: 0, rar, ...extra }; fresh.push(id); };
  for (const b of finishedBooks()) give('b:' + b.id, rarityFor(b), { snap: snapOf(b) });
  for (const d of STAR_MARKS) if (have >= d.cost) give(d.id, d.rar);
  for (const d of CHALLENGE_MARKS) if (d.t()) give(d.id, d.rar);
  if (fresh.length) celebrate({ e: RRBM.envelope(120), title: fresh.length > 1 ? `${fresh.length} bookmark envelopes!` : 'A bookmark envelope!',
    text: fresh.length > 1 ? 'Something special is inside each one!' : 'Something special is inside!', envelope: true });
}
// Pictures and cover colours for a book's bookmark: looked up once, then saved with the book.
async function analyzeBook(b) {
  try {
    const r = await RRBM.analyze(b, coverSrc(b.cover));

    Object.assign(cur, { icons: r.icons, pal: r.pal, themes: r.themes, bmv: 1 });

}

function updateTimerUI() {
  if (view !== 'read' || !$('#tClock')) return;
  const ms = timerMs(), s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600), mm = Math.floor(s / 60) % 60, ss = s % 60;
  $('#tClock').textContent = h ? `${h}:${pad(mm)}:${pad(ss)}` : `${mm}:${pad(ss)}`;
  const today = secsOn(dayKey()) / 60, goal = S.goal, met = today >= goal;
  $('#tSub').textContent = `${Math.floor(today)} of ${goal} min today`;
  const fg = $('#tRing .ringfg'), r = (270 - 22) / 2, c = 2 * Math.PI * r;
  fg.setAttribute('stroke-dashoffset', c * (1 - Math.min(1, today / goal)));
  fg.setAttribute('stroke', met ? 'var(--green)' : 'var(--orange)');
  const left = Math.ceil(goal - today);
  let msg;
  if (!S.timer) msg = met ? 'Goal done today! Extra reading = extra stars ⭐' : `${left} minute${left === 1 ? '' : 's'} to reach your goal!`;
  else if (!S.timer.startedAt) msg = 'Paused. Ready when you are!';
  else if (met) msg = 'Goal smashed! Keep going for bonus stars! 🌟';
  else if (today / goal >= .75) msg = `Almost there! Just ${left} more minute${left === 1 ? '' : 's'}! 🔥`;
  else if (today / goal >= .5) msg = 'Halfway there! Awesome! 🚀';
  else if (s < 60) msg = 'Blast off! Happy reading! 📖';
  else msg = 'You\'re doing great! Keep reading! 💪';
  $('#tMsg').textContent = msg;
}

// Walking pets: live in their own layer over every page; taps go straight through them.
const petBox = document.createElement('div');
petBox.id = 'pets';
document.body.appendChild(petBox);
let pets = [], petRAF = 0, petLast = 0;
function petArea() {
  const watching = document.body.classList.contains('watch'), top = watching ? 16 : 70;
  return { W: innerWidth, top, bot: Math.max(top + 120, innerHeight - (watching ? 12 : 96)) };
}
let watchT;
function startWatch() {
  if (document.body.classList.contains('watch')) return;
  document.body.classList.add('watch');
  history.pushState({ watch: 1 }, '');
  const tap = $('#watchTap'); tap.classList.remove('faded');
  clearTimeout(watchT); watchT = setTimeout(() => tap.classList.add('faded'), 2500);
  pets.forEach(o => { if (o.fly) o.base = petSkyY(o); else { o.wait = 0; petTarget(o); } });
  if (!pets.length) toast('No animals are out yet. Tap some in Unlocks first!');
  RRBG.reflow();
}
function endWatch() {
  if (!document.body.classList.contains('watch')) return;
  document.body.classList.remove('watch');
  pets.forEach(o => { if (!o.fly) { const A = petArea(); o.y = Math.min(Math.max(o.y, A.top), A.bot - o.h); petTarget(o); } else o.base = petSkyY(o); });
  RRBG.reflow();
}
$('#watchTap').addEventListener('click', () => { if (history.state && history.state.watch) history.back(); else endWatch(); });
addEventListener('popstate', endWatch);
function petTarget(o) { const A = petArea(); o.tx = Math.random() * Math.max(10, A.W - o.w); o.ty = A.top + Math.random() * Math.max(10, A.bot - A.top - o.h); }
// fliers stay in the upper part of the screen; swimmers can glide anywhere
function petSkyY(o) { const A = petArea(); return A.top + Math.random() * Math.max(20, o && o.swim ? A.bot - A.top - o.h : (A.bot - A.top) * .45); }
function makePet(a) {
  const h = a.size, art = PETART[a.id], el = document.createElement('div');
  el.className = `pet ${art.fly || art.swim ? 'flyer walking' : ''}`;
  el.innerHTML = `<div class="shadow"></div><div class="flip">${petSVG(a.id, h)}</div>`;
  petBox.appendChild(el);
  const A = petArea(), w = h * art.w / art.h;
  const o = { a, el, h, w, flip: el.children[1], fly: !!(art.fly || art.swim), swim: !!art.swim, wait: Math.random() * 2,
    face: 1, ph: Math.random() * 6, vx: (Math.random() < .5 ? -1 : 1) * a.speed * .7, x: Math.random() * Math.max(10, A.W - w), y: 0 };
  o.y = o.base = o.fly ? petSkyY(o) : A.top + Math.random() * Math.max(10, A.bot - A.top - h);
  petTarget(o);
  return o;
}
function syncPets() {
  const want = (S.pets || []).filter(id => S.unlocked?.[id] && ANIMALS.some(a => a.id === id) && PETART[id]);  // skip any drawing that hasn't loaded
  pets = pets.filter(o => want.includes(o.a.id) || (o.el.remove(), false));
  for (const id of want) if (!pets.some(o => o.a.id === id)) pets.push(makePet(ANIMALS.find(a => a.id === id)));
  if (pets.length && !petRAF) { petLast = performance.now(); petRAF = requestAnimationFrame(petFrame); }
}
function petFrame(t) {
  if (!pets.length) { petRAF = 0; return; }
  const dt = Math.min(.05, (t - petLast) / 1000); petLast = t;
  const A = petArea();
  for (const o of pets) {
    if (o.fly) {
      o.x += o.vx * dt;
      if (o.x > A.W + 40) { o.x = -o.w - 30; o.base = petSkyY(o); }
      if (o.x < -o.w - 40) { o.x = A.W + 30; o.base = petSkyY(o); }
      const bf = o.a.id === 'butterfly';
      o.y = o.base + Math.sin(t / (bf ? 300 : 650) + o.ph) * (bf ? 18 : 10);
      o.face = o.vx > 0 ? 1 : -1;
      o.el.style.zIndex = 5000;
    } else {
      if (o.wait > 0) { o.wait -= dt; o.el.classList.remove('walking'); }
      else {
        const dx = o.tx - o.x, dy = o.ty - o.y, d = Math.hypot(dx, dy);
        if (d < 4) { o.wait = 1 + Math.random() * 3.5; petTarget(o); }
        else {
          const sp = o.a.speed * .6;
          o.x += dx / d * sp * dt; o.y += dy / d * sp * dt;
          if (Math.abs(dx) > 2) o.face = dx > 0 ? 1 : -1;
          o.el.classList.add('walking');
        }
      }
      o.el.style.zIndex = Math.round(o.y);
    }
    o.el.style.transform = `translate(${o.x}px,${o.y}px)`;
    o.flip.style.transform = `scaleX(${o.face})`;
  }
  petRAF = requestAnimationFrame(petFrame);
}
addEventListener('resize', () => pets.forEach(o => { if (!o.fly) petTarget(o); }));

// "Dog Man: A Sprinkle in Time: A Graphic Novel (Dog Man #15): From the Creator of ..." -> "Dog Man: A Sprinkle in Time"
function tidyTitle(t) {
  return String(t).replace(/\s*\([^)]*\)/g, '').split(':').map(s => s.trim())
    .filter((s, i) => i === 0 || !/graphic novel|from the (creator|author)|a novel|book \d|series/i.test(s))
    .join(': ').trim();
}
// Kids-only search: a book must be labelled for kids or young readers, and nothing grown-up.
const KID = /kids?|children|juvenile|young adult|picture book/i;
const GROWNUP = /erotic|sex(ual|uality)?|romance|adult fiction|mature/i;
const kidSafe = labels => labels.some(l => KID.test(l)) && !labels.some(l => GROWNUP.test(l));
async function findBooks(q) {
  const out = [], seen = new Set();
  let reached = false;
  const isbn = q.replace(/[\s-]/g, '');
  const byBarcode = /^(97[89])?\d{9}[\dXx]$/.test(isbn);

  // 1. Apple Books: has most newer kids' books and big clear covers.
  try {
    const url = byBarcode
      ? `https://itunes.apple.com/lookup?isbn=${isbn}&country=us`
      : `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=ebook&entity=ebook&limit=15&country=us`;
    const j = await (await fetch(url)).json(); reached = true;
    for (const r of j.results || []) {
      if (!r.artworkUrl100 || !r.trackName || !kidSafe(r.genres || [])) continue;
      const title = tidyTitle(r.trackName);
      if (seen.has(title.toLowerCase())) continue;
      seen.add(title.toLowerCase());
      out.push({ title, author: (r.artistName || '').split(/\s*&\s*/)[0], cover: r.artworkUrl100.replace(/\/\d+x\d+bb\.(jpg|png)$/, '/400x600bb.$1'), pages: 0 });
    }
  } catch (e) {}

  // 2. Open Library: free library catalogue, knows page counts.
  try {
    const url = byBarcode
      ? `https://openlibrary.org/search.json?isbn=${isbn}&fields=title,author_name,cover_i,number_of_pages_median,subject`
      : `https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=50&fields=title,author_name,cover_i,number_of_pages_median,subject`;
    const j = await (await fetch(url)).json(); reached = true;
    for (const d of j.docs || []) {
      if (!kidSafe(d.subject || [])) continue;
      const cover = d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg?default=false`
        : byBarcode ? `https://covers.openlibrary.org/b/isbn/${isbn}-M.jpg?default=false` : '';
      if (!cover || seen.has(cover)) continue;
      seen.add(cover);
      out.push({ title: d.title, author: (d.author_name || [])[0] || '', cover, pages: d.number_of_pages_median || 0 });
      if (out.length >= 24) break;
    }
  } catch (e) {}

  // 3. Google Books, only if the others came up short (its free daily limit often runs out).
  if (out.length < 3) {
    try {
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20&printType=books&maxAllowedMaturityRating=not-mature`);
      const j = await r.json(); reached = true;
      for (const it of j.items || []) {
        const v = it.volumeInfo || {}, img = v.imageLinks && (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail);
        if (!img || v.maturityRating === 'MATURE' || !kidSafe(v.categories || [])) continue;
        out.push({ title: v.title, author: (v.authors || [])[0] || '', cover: img.replace(/^http:/, 'https:'), pages: v.pageCount || 0 });
      }
    } catch (e) {}
  }
  if (!reached) throw new Error('offline');
  return out;
}

async function guessPages(r) {
  try {
    const j = await (await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(r.title)}&author=${encodeURIComponent(r.author)}&limit=3&fields=number_of_pages_median`)).json();

}

function saveProgress() {

let audio, wakeLock;

}

const SOUNDS = { popper: '🎉 Party popper & cheer', applause: '👏 Clapping & cheering', fireworks: '🎆 Fireworks', fanfare: '🎺 Trumpet fanfare',
  tada: '🥁 Drumroll & ta-da', magic: '✨ Magic sparkle', off: '🔇 No sound' };
const SFX_DEFAULT = { goal: 'popper', bonus: 'fireworks', book: 'applause' };
const sfxEl = new Audio();
sfxEl.preload = 'auto';
let sfxReady = false;
// Phones only let a page play sound after a tap, so the first tap quietly "wakes" the player.

/* ---------- confetti, cannons, fireworks, rocket ---------- */
const FX_COLORS = ['#FF7A1A', '#FFC93C', '#22C55E', '#6C4BF4', '#FF5C8A', '#12B5A6', '#3B82F6', '#FFFFFF'];
const fxParts = [], fxRockets = [];
let fxRunning = false;
const pickc = () => FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)];
function fxStart() {
  if (fxRunning) return;
  fxRunning = true;
  const cv = $('#confetti'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  (function frame() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (let i = fxRockets.length - 1; i >= 0; i--) {
      const r = fxRockets[i];
      r.y += r.vy; r.x += r.vx; r.vy *= .985;
      ctx.fillStyle = '#FFE9A8'; ctx.beginPath(); ctx.arc(r.x, r.y, 2.6, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,200,120,.35)'; ctx.fillRect(r.x - 1, r.y, 2, 16);

    }

      p.vy += p.g; p.vx *= p.drag; p.vy *= p.drag; p.x += p.vx; p.y += p.vy; p.a += p.va; p.life--;
      if (p.life <= 0 || p.y > innerHeight + 30) { fxParts.splice(i, 1); continue; }
      ctx.globalAlpha = p.spark ? Math.min(1, p.life / 30) : 1;
      if (p.spark) { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
      else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
      ctx.globalAlpha = 1;
    }
    if (fxParts.length || fxRockets.length) requestAnimationFrame(frame);
    else { ctx.clearRect(0, 0, innerWidth, innerHeight); fxRunning = false; }
  })();
}
const piece = (x, y, vx, vy) => ({ x, y, vx, vy, r: Math.random() * 6 + 5, c: pickc(), a: Math.random() * 6, va: (Math.random() - .5) * .45, g: .32, drag: .99, life: 400 });
function confetti() {
  for (let i = 0; i < 160; i++) fxParts.push(piece(innerWidth / 2 + (Math.random() - .5) * 80, innerHeight * .35, (Math.random() - .5) * 14, -Math.random() * 14 - 4));
  fxStart();
}
// Book finished: two confetti cannons fire from the bottom corners, three times.
function cannons() {
  [0, 350, 700].forEach(delay => setTimeout(() => {
    for (let i = 0; i < 70; i++) {
      const sp = 14 + Math.random() * 10, ang = (60 + Math.random() * 22) * Math.PI / 180;
      fxParts.push(piece(-10, innerHeight - 20, Math.cos(ang) * sp, -Math.sin(ang) * sp));
      fxParts.push(piece(innerWidth + 10, innerHeight - 20, -Math.cos(ang) * sp, -Math.sin(ang) * sp));
    }
    fxStart();
  }, delay));
}
function burst(x, y) {
  const c1 = pickc(), c2 = pickc(), n = 80 + Math.floor(Math.random() * 40);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 6 + 1.5;
    fxParts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: Math.random() * 2.2 + 2, c: i % 3 ? c1 : c2, a: 0, va: 0, g: .06, drag: .975, life: 70 + Math.random() * 40, spark: true });
  }
}
// Extra reading: a fireworks show for a few seconds.

  dim.animate([{ opacity: 0 }, { opacity: 1, offset: .08 }, { opacity: 1, offset: .85 }, { opacity: 0 }], { duration: seconds * 1000 + 1800, fill: 'forwards' }).onfinish = () => dim.remove();
  (function launch() {
    const n = Math.random() < .35 ? 2 : 1;
    for (let k = 0; k < n; k++) fxRockets.push({ x: innerWidth * (.15 + Math.random() * .7), y: innerHeight + 10, vx: (Math.random() - .5) * 1.4, vy: -(11 + Math.random() * 4), ty: innerHeight * (.12 + Math.random() * .35) });
    fxStart();
    if (performance.now() < end) setTimeout(launch, 280 + Math.random() * 380);
  })();
}
// Daily goal: a rocket blasts off from the bottom of the screen.
function rocketLaunch() {
  const el = document.createElement('div');
  el.className = 'launch';
  el.innerHTML = `<svg viewBox="0 0 60 120" width="70" height="140"><path d="M30 2 C44 16 48 40 46 72 L14 72 C12 40 16 16 30 2Z" fill="#F4F4F8"/><path d="M30 2 C38 10 42 20 44 30 L16 30 C18 20 22 10 30 2Z" fill="#E8304A"/>
    <circle cx="30" cy="46" r="8" fill="#3AA0FF" stroke="#9aa3b5" stroke-width="3"/><path d="M14 56 L2 80 L16 74Z M46 56 L58 80 L44 74Z" fill="#E8304A"/><rect x="20" y="72" width="20" height="6" fill="#9aa3b5"/>
    <g class="flame"><path d="M20 78 C22 96 26 104 30 118 C34 104 38 96 40 78Z" fill="#FFB020"/><path d="M25 78 C26 90 28 96 30 106 C32 96 34 90 35 78Z" fill="#FFF07A"/></g></svg>`;
  document.body.appendChild(el);
  const x = innerWidth / 2 - 35;
  const a = el.animate([{ transform: `translate(${x}px,${innerHeight + 20}px) rotate(0)` }, { transform: `translate(${x}px,${innerHeight * .55}px) rotate(-2deg)`, offset: .35 },
    { transform: `translate(${x + 30}px,-200px) rotate(6deg)` }], { duration: 2600, easing: 'cubic-bezier(.5,0,.75,.4)', fill: 'forwards' });
  const puff = setInterval(() => {
    const r = el.getBoundingClientRect(), s = document.createElement('span');
    s.className = 'puff'; s.style.left = (r.left + 35 + (Math.random() - .5) * 16) + 'px'; s.style.top = (r.top + 128) + 'px';
    document.body.appendChild(s); setTimeout(() => s.remove(), 1200);
  }, 70);
  a.onfinish = () => { clearInterval(puff); el.remove(); };
}

/* =========================================================
   TAPS
   ========================================================= */
const ACT = {
  nav(el) { view = el.dataset.v; if (view !== 'parent') parentOK = false; render(); updateTimerUI(); scrollTo(0, 0); },
  filter(el) { shelfFilter = el.dataset.f; renderMain(); },
  showFinished() { shelfFilter = 'finished'; view = 'shelf'; render(); document.querySelector('.sectionhead')?.scrollIntoView({ behavior: 'smooth' }); },
  unlockTab(el) { unlockTab = el.dataset.k; renderMain(); },
  pickUnlock(el) {
    const u = UNLOCKS.find(x => x.id === el.dataset.id);
    if (!S.unlocked[u.id]) { const need = u.cost - starsEarned(); return toast(`Earn ${need.toLocaleString()} more ⭐ to unlock the ${u.n}!`); }
    if (u.kind === 'animal') {
      S.pets ||= [];
      const i = S.pets.indexOf(u.id);
      if (i >= 0) { S.pets.splice(i, 1); toast(`The ${u.n} went home for a nap 💤`); }
      else { S.pets.push(u.id); toast(`The ${u.n} is out walking with you!`); }
      save(); syncPets(); renderMain(); return;
    }
    S.bg = u.id; save(); render(); toast(`${u.n} background is on!`);
  },
  petsAway() { S.pets = []; save(); syncPets(); renderMain(); toast('Everyone went home for a nap 💤'); },
  watch() { startWatch(); },
  openBook(el) { closeSheet(); currentBook = el.dataset.id; view = 'book'; render(); scrollTo(0, 0); },
  addBook() { openAdd(); },
  closeSheet,
  search: doSearch,
  pick(el) {
    const r = addFlow.results[+el.dataset.i];
    Object.assign(addFlow.chosen, { title: r.title, author: r.author, cover: r.cover, pages: r.pages || addFlow.chosen.pages });
    addFlow.step = 'details'; renderAdd();
    if (!addFlow.chosen.pages) guessPages(r);
  },
  noPic() { addFlow.chosen.cover = ''; addFlow.chosen.title ||= $('#q').value.trim(); addFlow.step = 'details'; renderAdd(); },
  photo() { $('#photoIn').click(); },
  changePic() { grabDetails(); addFlow.step = 'search'; addFlow.q = ''; addFlow.results = []; renderAdd(); },
  saveBook() {
    grabDetails();
    const c = addFlow.chosen;
    if (!c.title) return toast('Your book needs a name!');
    if (addFlow.editId) {
      const b = book(addFlow.editId);
      const looks = b.title !== c.title || b.cover !== c.cover;
      Object.assign(b, { title: c.title, author: c.author, cover: c.cover, totalPages: c.pages });
      if (b.totalPages && b.page > b.totalPages) b.page = b.totalPages;
      if (looks) { delete b.bmv; analyzeBook(b); }
      toast('Changed! ✏️');
    } else {
      let start = Math.max(0, parseInt($('#bStart').value) || 0);
      if (c.pages) start = Math.min(start, c.pages);
      const b = { id: uid(), title: c.title, author: c.author, cover: c.cover, totalPages: c.pages, page: start, chapter: '', note: '',
        status: 'reading', added: Date.now(), lastRead: null, secs: 0 };
      S.books.push(b); S.selBook = b.id;
      analyzeBook(b);
      toast('On your shelf! 📚');
    }
    save(); closeSheet(); checkBadges(); render();
  },
  readBook(el) { if (!S.timer) S.selBook = el.dataset.id; view = 'read'; render(); updateTimerUI(); scrollTo(0, 0); },
  selBook(el) { S.selBook = el.dataset.id; save(); renderMain(); updateTimerUI(); },
  start() {
    unlockAudio();
    const now = Date.now();
    S.timer = { bookId: S.selBook, startedAt: now, accum: 0, day: dayKey(), start: now };
    save(); wake(); render(); updateTimerUI();
  },
  pause() { S.timer.accum += Date.now() - S.timer.startedAt; S.timer.startedAt = null; save(); releaseWake(); render(); updateTimerUI(); },
  resume() { unlockAudio(); S.timer.startedAt = Date.now(); save(); wake(); render(); updateTimerUI(); },
  done() {
    if (S.timer.startedAt) { S.timer.accum += Date.now() - S.timer.startedAt; S.timer.startedAt = null; }
    save(); releaseWake(); render(); updateTimerUI();
    openProgress(S.timer.bookId, { secs: S.timer.accum / 1000, day: S.timer.day, start: S.timer.start });
  },
  cancelTimer() { if (confirm('Stop the timer without saving this time?')) { S.timer = null; save(); releaseWake(); render(); updateTimerUI(); } },
  updatePage(el) { openProgress(el.dataset.id); },
  pgStep(el) { const i = $('#pg'); i.value = Math.max(0, (parseInt(i.value) || 0) + +el.dataset.n); },
  saveProgress,
  finishAsk(el) {
    openSheet(`<button class="x" data-act="closeSheet">✕</button><h2>Did you read the whole book? 🤔</h2>
      <p class="hint">All the way to the very last page?</p>
      <div class="row2" style="margin-top:18px"><button class="btn white" data-act="closeSheet">Not yet</button>
      <button class="btn green" data-act="finishYes" data-id="${el.dataset.id}">Yes! 🎉</button></div>`);
  },
  finishYes(el) { const b = book(el.dataset.id); b.lastRead = Date.now(); finishBook(b); save(); closeSheet(); checkBadges(); render(); },
  startOverAsk(el) {
    const b = book(el.dataset.id);
    openSheet(`<button class="x" data-act="closeSheet">✕</button><h2>Start "${esc(b.title)}" over? 🔄</h2>
      <p class="hint">This book goes back to page 0. Its chapter, note and time in this book are cleared.</p>
      <p class="hint">Your stars ⭐, streak 🔥 and badges 🏆 stay. You already earned those!</p>
      <div class="row2" style="margin-top:18px"><button class="btn white" data-act="closeSheet">Keep it</button>
      <button class="btn orange" data-act="startOver" data-id="${b.id}">Start over</button></div>`);
  },
  startOver(el) {
    const b = book(el.dataset.id);
    if (b.status === 'finished') S.rereads = (S.rereads || 0) + 1;
    Object.assign(b, { status: 'reading', page: 0, chapter: '', note: '', secs: 0, lastRead: null, finishedAt: null, resetAt: Date.now() });
    save(); closeSheet(); render(); scrollTo(0, 0); toast('Back to page 0. Here we go! 🚀');
  },
  editBook(el) { openAdd(el.dataset.id); },
  delBook(el) {
    const b = book(el.dataset.id);
    if (!confirm(`Take "${b.title}" off your shelf?`)) return;
    if (markOf(b)) markOf(b).snap = snapOf(b);  // a won bookmark stays in the collection
    S.books = S.books.filter(x => x.id !== b.id);
    save(); view = 'shelf'; render();
  },
  partyNext() { nextParty(); },
  badgeInfo(el) { if (el.dataset.id) badgeInfo(el.dataset.id); },
  openMarks, showEnvelope, tearOpen, closeReveal,
  markInfo(el) {
    const id = el.dataset.id, m = S.marks[id], isBook = id.startsWith('b:'), b = isBook ? book(id.slice(2)) : null;
    const d = MARKDEFS.find(x => x.id === id);
    const sp = isBook ? (b ? bookSpec(b) : markSpec(id)) : markSpec(id, m && m.open ? 4 : 0);
    const name = isBook ? sp.title : m && m.open ? d.n : 'Mystery bookmark';
    const how = m && !m.open ? 'You won this one! Open the envelope to see it.'
      : m ? `${RAR_SHORT[m.rar]} · won ${niceDate(m.t)}`
      : isBook ? `Keep reading to build it. You win it when you finish the book!`
      : d.cost ? `Earn ${d.cost.toLocaleString()} stars to win it. You have ${starsEarned().toLocaleString()}!` : `${d.d} to win it!`;
    openSheet(`<button class="x" data-act="closeSheet">✕</button><h2>${esc(name)}</h2><p class="hint" style="margin:0">${esc(how)}</p>
      <div class="bmbig">${RRBM.svg(sp, 120)}</div>
      ${m && !m.open ? '<button class="btn orange block" data-act="openMarks">📩 Open it!</button>' : ''}
      ${b ? `<button class="btn white block" style="margin-top:10px" data-act="openBook" data-id="${b.id}">📖 Go to the book</button>` : ''}`);
  },
  testSfx(el) {
    const k = el.dataset.k;
    playSfx(k);
    if (k === 'goal') { rocketLaunch(); confetti(); } else if (k === 'bonus') fireworks(5); else cannons();
  },

  parent() {
    if (view === 'parent') return;
    const a = 6 + Math.floor(Math.random() * 7), b = 6 + Math.floor(Math.random() * 7);
    openSheet(`<button class="x" data-act="closeSheet">✕</button><h2>Grown-ups only 🔒</h2>
      <label class="l">What is ${a} × ${b}?</label><input class="in" id="pin" type="number" inputmode="numeric" data-ans="${a * b}">
      <button class="btn block" style="margin-top:16px" data-act="unlock">Open</button>`);
    const i = $('#pin'); setTimeout(() => i.focus(), 250);
    i.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.unlock(); });
  },
  unlock() {
    const i = $('#pin');
    if (+i.value === +i.dataset.ans) { parentOK = true; closeSheet(); view = 'parent'; render(); scrollTo(0, 0); }
    else { i.value = ''; toast('Not quite!'); }
  },
  goalStep(el) { const i = $('#pGoal'); i.value = Math.min(180, Math.max(5, (parseInt(i.value) || 20) + +el.dataset.n)); },
  saveParent() {
    S.name = $('#pName').value.trim() || 'Reader';
    S.goal = Math.min(180, Math.max(1, parseInt($('#pGoal').value) || 20));
    S.reward = { text: $('#pReward').value.trim(), cost: Math.max(0, parseInt($('#pCost').value) || 0) };
    save(); render(); toast('Settings saved');
  },
  rewardGiven() {
    if (!confirm(`Give the reward and take away ${S.reward.cost} stars?`)) return;
    S.stars -= S.reward.cost; S.rewardsGiven = (S.rewardsGiven || 0) + 1; save(); checkBadges(); render();
    celebrate({ e: '🎁', title: 'Reward unlocked!', text: `Enjoy: ${S.reward.text}`, confetti: true });
  },
  exportData() {
    const withPhotos = (k, v) => k === 'cover' && typeof v === 'string' && v.startsWith('idb:') ? coverSrc(v) : v;
    const blob = new Blob([JSON.stringify(S, withPhotos, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `reading-rocket-backup-${dayKey()}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  importData() { $('#importIn').click(); },
  eraseAll() {
    if (!confirm('Erase ALL books, reading times, stars and badges on this phone?')) return;
    if (!confirm('Really? This cannot be undone. (Download a backup first if you are not sure.)')) return;
    S = JSON.parse(JSON.stringify(DEFAULTS)); save(); parentOK = false; view = 'shelf'; render();
  },
};
$('#importIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.books)) throw 0;
    if (!confirm(`Restore this backup (${data.books.length} books)? It replaces what is on this phone now.`)) return;
    S = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), data);
    if (!(await movePhotos())) save();
    render(); toast('Backup restored!');
  } catch (err) { toast('That file is not a Reading Rocket backup.'); }
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.sfx;
  if (!k) return;
  S.sfx = { ...SFX_DEFAULT, ...(S.sfx || {}), [k]: e.target.value }; save();
  playSound(e.target.value);
});
document.addEventListener('pointerdown', unlockSfx, { capture: true });
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e);
});

/* ---------- go! ---------- */
checkUnlocks(); render(); updateTimerUI(); checkBadges(); syncPets();
if (S.timer) { view = 'read'; render(); updateTimerUI(); }
loadPhotos().then(movePhotos).then(() => { prunePhotos(); if (!$('#shade').classList.contains('open')) render(); }).then(analyzeShelf);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

// ---------- staying up to date ----------
// Phones often resume the app from memory instead of reloading it, so check for a newer
// version whenever the app opens or comes back on screen, and reload into it.
const APP_VERSION = 'rr-shell-v30';  // must match SHELL in sw.js
async function checkForUpdate() {
  if (!location.protocol.startsWith('http')) return;
  try {
    const txt = await (await fetch('sw.js?check=' + Date.now(), { cache: 'no-store' })).text();
    const live = (txt.match(/SHELL = '([^']+)'/) || [])[1];
    if (!live || live === APP_VERSION) return;
    if ($('#shade').classList.contains('open') || $('#party').classList.contains('open')) return;  // never interrupt typing
    const tried = 'rr-update-' + live;
    try { if (sessionStorage.getItem(tried)) return; sessionStorage.setItem(tried, '1'); } catch (e) {}
    try { const reg = await navigator.serviceWorker?.getRegistration(); await reg?.update(); } catch (e) {}
    location.replace(location.pathname + '?v=' + encodeURIComponent(live));
  } catch (e) {}
}
setTimeout(checkForUpdate, 1500);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
